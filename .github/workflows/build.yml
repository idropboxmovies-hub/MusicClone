name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organizar projeto a partir do ZIP
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            mkdir -p /tmp/x && unzip -oq "${zips[0]}" -d /tmp/x
            src=$(dirname "$(find /tmp/x -name settings.gradle.kts | head -1)")
            rm -rf "$src/.github"
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
            cp -a "$src"/. .
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Organiza projeto a partir do ZIP" || true
            git push origin HEAD
          fi
          if [ ! -f settings.gradle.kts ]; then
            echo "::error::Projeto nao encontrado."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.9"}
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MusicClone-apk
          path: app/build/outputs/apk/debug/*.apk
